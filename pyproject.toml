[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-studio"
version = "0.2.0"
description = "RAG Agent Studio：MinerU 解析 + MinerU-Popo 文档树 + 语义感知切片 + 向量/BM25/HyDE 多路召回 + RRF + Reranker + MMR + UnWeaver + Agentic RAG + 多模态（文搜图 / 图搜图 / 图搜文）的全栈参考实现"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    # 核心库（prism）
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "jieba>=0.42.1",
    "bm25s>=0.2",
    "tqdm>=4.66",
    # Web 后端（app）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # LLM 后端：Anthropic 官方 SDK 与 OpenAI 兼容端点（Qwen / DashScope / DeepSeek / vLLM / Ollama）
    "anthropic>=1.0",
    "openai>=1.70",
    # 无 MinerU 时的兜底解析器
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.21",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    # 多模态：图片抽取 / 缩放 / 离线感知特征
    "pillow>=10.0",
]

[project.optional-dependencies]
# 真实向量模型 + 交叉编码器重排（BGE-M3 / bge-reranker-v2-m3）
models = ["sentence-transformers>=3.0", "torch>=2.1"]
# 难负样本的真实向量 / 精排微调；独立 dry-run 不需要这些依赖
finetune = ["sentence-transformers[train]>=6.1,<7", "transformers>=5,<6", "datasets>=2.16,<5", "accelerate>=1.3,<2", "torch>=2.2,<3"]
# 图文统一嵌入（CLIP / Chinese-CLIP）+ 图中文字 OCR：文搜图 / 图搜文的跨模态能力
multimodal = ["torch>=2.1", "transformers>=4.40", "rapidocr-onnxruntime>=1.3"]
# 文档解析：MinerU 4.x（macOS Apple Silicon 自动包含 torch；Linux / Windows 显式 [torch]）
mineru = ["mineru[torch]>=4.0,<5"]
# 可选向量库
qdrant = ["qdrant-client>=1.9"]
chroma = ["chromadb>=0.5"]
# Agent 湖：LanceDB 宽表 + DuckDB 只读 SQL 分析
lake = ["lancedb>=0.39", "duckdb>=1.1", "pandas>=2.0"]
# LanceDB：知识库向量后端 / 长期记忆 / 个性化推荐 / 多智能体黑板 / 多模态表
lancedb = ["lancedb>=0.39"]
dev = ["pytest>=8.0", "pytest-cov"]
all = ["rag-agent-studio[models,multimodal,mineru,qdrant,chroma,lake,lancedb,dev]"]

[project.scripts]
rag = "prism.cli:app"

[tool.setuptools.packages.find]
include = ["prism*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
