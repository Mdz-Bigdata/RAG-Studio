# 由 deploy/server.sh 安装到 /etc/nginx/conf.d/rag-studio.conf
# 应用只监听 127.0.0.1:8000，对外统一走这里。
# 是否要求账号密码由 /etc/nginx/rag-studio-auth.inc 决定（server.sh 生成：passwd 开启，open 关闭）
server {
    listen 80 default_server;
    listen 5173;                  # frp 隧道把这个端口映射到公网（frpc.toml 的 localPort）
    server_name _;
    client_max_body_size 200m;

    include /etc/nginx/rag-studio-auth.inc;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # 对话是流式输出
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
